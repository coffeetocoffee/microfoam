# SPDX-License-Identifier: MIT
#
# Microfoam CI.
#
# The gate that matters is the fault-injection suite: a library whose failure
# path has never been exercised is the failure mode this project exists to
# avoid. Everything else here exists to keep that suite buildable.

name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: host build and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      # Pinned rather than relying on the image's default interpreter, so the
      # module installed below and CMake's find_package(Python3) agree on one
      # Python across all three runners.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The cross test signs a patch and requires the device to refuse it
      # (fail-closed), so the host needs a signing module. The seed itself comes
      # from the build tree (CMakeLists generates it); cross_test.cmake fails
      # rather than silently skipping if either is missing.
      - name: Install the host signing module
        shell: bash
        run: python -m pip install --quiet cryptography

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --config Debug

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Debug

      - name: Report sizes
        if: always()
        shell: bash
        run: |
          echo "### Microfoam footprint" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f build/microfoam_tests ]; then
            ./build/microfoam_tests >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          elif [ -f build/Debug/microfoam_tests.exe ]; then
            ./build/Debug/microfoam_tests.exe >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          fi

  cross:
    name: cross-compile arm (${{ matrix.cortex }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cortex: [cortex-m0, cortex-m3, cortex-m4, cortex-m7]

    steps:
      - uses: actions/checkout@v4

      - name: Install the bare-metal arm toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Compile every source for ${{ matrix.cortex }}
        run: |
          set -e
          mkdir -p build-arm
          FLAGS="-mcpu=${{ matrix.cortex }} -mthumb -std=c99 -Os \
                 -ffunction-sections -fdata-sections -Wall -Wextra -Werror \
                 -Wconversion -Wsign-conversion -Wshadow -Wcast-qual \
                 -Iinclude -Isrc"
          # The libsodium adapter is opt-in and requires a host crypto library;
          # keep it out of the bare-metal core compile unless a provider-specific
          # embedded integration supplies its own implementation. The LZMA codec
          # and the built-in Ed25519 verifier are compiled separately below,
          # where their extra include paths are set.
          for f in src/*.c; do
            case "$f" in
              src/mcf_sodium.c|src/mcf_lzma.c|src/mcf_ed25519.c|src/mcf_sha512.c|src/mcf_tn_glue.c) continue ;;
            esac
            echo "  $f"
            arm-none-eabi-gcc $FLAGS -c "$f" -o "build-arm/$(basename "$f" .c).o"
          done

      - name: Compile the built-in Ed25519 verifier for ${{ matrix.cortex }}
        run: |
          set -e
          # Opt-in and supported, so it must compile for every target. Ours
          # keeps the strict set; the vendored TweetNaCl wrapper is relaxed,
          # matching how CMake builds it.
          STRICT="-mcpu=${{ matrix.cortex }} -mthumb -std=c99 -Os \
                 -ffunction-sections -fdata-sections -Wall -Wextra -Werror \
                 -Wconversion -Wsign-conversion -Wshadow -Wcast-qual \
                 -Iinclude -Isrc -Ithird_party/tweetnacl -DMCF_ENABLE_ED25519=1"
          RELAXED="-mcpu=${{ matrix.cortex }} -mthumb -std=c99 -Os \
                 -ffunction-sections -fdata-sections -Wall -Wextra \
                 -Ithird_party/tweetnacl"
          arm-none-eabi-gcc $STRICT -c src/mcf_ed25519.c -o build-arm/mcf_ed25519.o
          arm-none-eabi-gcc $STRICT -c src/mcf_sha512.c -o build-arm/mcf_sha512.o
          arm-none-eabi-gcc $RELAXED -c src/mcf_tn_glue.c \
            -o build-arm/mcf_tn_glue.o
          arm-none-eabi-size build-arm/mcf_ed25519.o build-arm/mcf_sha512.o \
            build-arm/mcf_tn_glue.o >> "$GITHUB_STEP_SUMMARY"

      - name: Compile the LZMA codec for ${{ matrix.cortex }}
        run: |
          set -e
          # The LZMA codec is opt-in but supported; compile it and the vendored
          # SDK for every core so enabling it can never break a target. Our own
          # adapter keeps the strict warning set; the vendored SDK is built
          # with the same relaxed flags CMake uses for it.
          STRICT="-mcpu=${{ matrix.cortex }} -mthumb -std=c99 -Os \
                 -ffunction-sections -fdata-sections -Wall -Wextra -Werror \
                 -Wconversion -Wsign-conversion -Wshadow -Wcast-qual \
                 -Iinclude -Isrc -Ithird_party/lzma-sdk -DMCF_ENABLE_LZMA=1"
          RELAXED="-mcpu=${{ matrix.cortex }} -mthumb -std=c99 -Os \
                 -ffunction-sections -fdata-sections -Wall -Wextra \
                 -Ithird_party/lzma-sdk"
          arm-none-eabi-gcc $STRICT -c src/mcf_lzma.c -o build-arm/mcf_lzma.o
          arm-none-eabi-gcc $RELAXED -c third_party/lzma-sdk/LzmaDec.c \
            -o build-arm/lzma_sdk_LzmaDec.o
          arm-none-eabi-size build-arm/mcf_lzma.o build-arm/lzma_sdk_LzmaDec.o \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Link for the size map
        run: |
          set -e
          arm-none-eabi-size -t build-arm/*.o || true
          arm-none-eabi-gcc -mcpu=${{ matrix.cortex }} -mthumb -nostdlib \
            -Wl,--gc-sections -Wl,-Map=build-arm/microfoam.map \
            build-arm/*.o -o build-arm/libmicrofoam.a 2>/dev/null || true

      - name: Size gate for ${{ matrix.cortex }}
        # This is a gate, not a report. It compiles the non-opt-in sources for
        # this core and fails if .text exceeds the committed ceiling or if any
        # static RAM appears. The object table is still written to the summary
        # for humans; the pass/fail comes from the comparison.
        run: |
          set -e
          cmake -DCORE=${{ matrix.cortex }} \
                -DCC="$(which arm-none-eabi-gcc)" \
                -DSRC="$PWD" \
                -DBASELINE="$PWD/cmake/size_baseline.txt" \
                -DWORK="$PWD/build-size" \
                -P cmake/size_gate.cmake
          echo "### ${{ matrix.cortex }} object sizes" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          arm-none-eabi-size build-arm/*.o >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  cross-clang:
    name: cross-compile clang arm (${{ matrix.cortex }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cortex: [cortex-m0, cortex-m3, cortex-m4, cortex-m7]

    # Hoisted so the three compile groups below cannot drift apart.
    env:
      TARGET: "--target=arm-none-eabi -mcpu=${{ matrix.cortex }} -mthumb -std=c99 -Os"
      SECTIONS: "-ffunction-sections -fdata-sections"
      STRICT: >-
        -Wall -Wextra -Wshadow -Wundef -Wcast-qual -Wpointer-arith
        -Wstrict-prototypes -Wmissing-prototypes -Wconversion -Wsign-conversion
        -Wdouble-promotion -Werror=return-type -Wformat=2 -Wvla -Wwrite-strings
        -Wcast-function-type -Werror

    steps:
      - uses: actions/checkout@v4

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      # Why this job exists. docs/architecture.md section 14.3 selects Ed25519 for
      # signature verification, and the README lists armclang as an unverified
      # portability target pending a licensed toolchain. armclang IS clang - LLVM
      # with Arm's backend patches - so upstream clang targeting arm-none-eabi is
      # a free, redistributable, CI-able proxy for a large part of that
      # assurance: the same frontend, the same diagnostic engine, the same
      # code-generator family. It is not armclang and does not claim to be; the
      # licensed build stays pending, and the README says so.
      #
      # Two things worth knowing about this gate:
      #
      #   - The strict set is the same one the GCC job uses. Clang accepts every
      #     flag in it, so the two jobs check the same contract with two
      #     independent diagnostic engines. That is the point: -Wconversion and
      #     -Wsign-conversion in particular have different implementations in the
      #     two frontends, and this source set is clean under both.
      #   - Clang makes an unknown -W flag FATAL under -Werror (verified: it
      #     reports -Wunknown-warning-option as an error). So if a future clang
      #     drops a flag, this job fails loudly instead of silently checking
      #     less. That is the behaviour a gate should have.
      #
      # No size comparison here, deliberately. The size gate stays on the
      # shipping toolchain (ARM GCC) where the committed ceilings mean something;
      # a clang ceiling would be a baseline for a compiler nobody ships. The
      # measured GCC-vs-clang code-size difference is recorded in the README
      # instead, where it informs the armclang decision rather than gating CI.
      - name: Compile every source for ${{ matrix.cortex }} with clang
        run: |
          set -e
          mkdir -p build-clang-arm
          # Core sources: everything except the opt-in modules, which need extra
          # include paths and are compiled below. The libsodium adapter is
          # excluded for the same reason as in the GCC job - it needs a host
          # crypto library that a bare-metal target does not have.
          for f in src/*.c; do
            case "$f" in
              src/mcf_sodium.c|src/mcf_lzma.c|src/mcf_ed25519.c|src/mcf_sha512.c|src/mcf_tn_glue.c) continue ;;
            esac
            echo "  $f"
            clang $TARGET $SECTIONS $STRICT -Iinclude -Isrc \
              -c "$f" -o "build-clang-arm/$(basename "$f" .c).o"
          done

          # The built-in Ed25519 verifier. mcf_tn_glue.c includes the vendored
          # TweetNaCl, so warnings are off for that one file; our two keep the
          # full set.
          echo "  src/mcf_ed25519.c (opt-in)"
          clang $TARGET $SECTIONS $STRICT -Iinclude -Isrc -Ithird_party/tweetnacl \
            -DMCF_ENABLE_ED25519=1 -c src/mcf_ed25519.c \
            -o build-clang-arm/mcf_ed25519.o
          echo "  src/mcf_sha512.c (opt-in)"
          clang $TARGET $SECTIONS $STRICT -Iinclude -Isrc -Ithird_party/tweetnacl \
            -DMCF_ENABLE_ED25519=1 -c src/mcf_sha512.c \
            -o build-clang-arm/mcf_sha512.o
          echo "  src/mcf_tn_glue.c (opt-in, vendored include)"
          clang $TARGET $SECTIONS -w -Iinclude -Isrc -Ithird_party/tweetnacl \
            -DMCF_ENABLE_ED25519=1 -c src/mcf_tn_glue.c \
            -o build-clang-arm/mcf_tn_glue.o

          # The LZMA codec: our adapter strict, the vendored SDK relaxed.
          echo "  src/mcf_lzma.c (opt-in)"
          clang $TARGET $SECTIONS $STRICT -Iinclude -Isrc -Ithird_party/lzma-sdk \
            -DMCF_ENABLE_LZMA=1 -c src/mcf_lzma.c -o build-clang-arm/mcf_lzma.o
          echo "  third_party/lzma-sdk/LzmaDec.c (vendored)"
          clang $TARGET $SECTIONS -w -Ithird_party/lzma-sdk \
            -c third_party/lzma-sdk/LzmaDec.c -o build-clang-arm/lzma_sdk_LzmaDec.o

          echo "clang cross-compile clean for ${{ matrix.cortex }}"

  python:
    name: host tool self-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Round-trip the host tool end to end
        run: |
          set -e
          # Without these the self-test SKIPs its signing round-trip and every
          # MFP2 case - a green run that proves less than it appears to.
          python -m pip install --quiet cryptography pynacl
          mkdir -p build-py
          python host/selftest.py

  packaging:
    name: host tool packaging
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Every other job runs the tool in place (`python host/microfoam.py ...`),
      # so none of them read pyproject.toml, exercise the package-dir mapping,
      # or invoke the console-script entry point. An extra renamed to something
      # that no longer matches its dependency, or a module that stopped
      # shipping in the sdist, would leave all of them green and only break for
      # the first downstream user. This is the one job that installs the
      # distribution the way a user does.
      - name: Build the sdist and wheel
        run: |
          set -e
          python -m pip install --quiet build
          python -m build --outdir dist

      - name: Install the built sdist with both signing extras
        run: |
          set -e
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --quiet --upgrade pip
          # Installed from the sdist rather than the checkout, so a file that
          # the build backend fails to include is caught here and not by a
          # user. Note the variable: a bare `dist/*.tar.gz[mfp1,mfp2]` would be
          # a glob bracket expression, not an extras specifier.
          SDIST=$(ls dist/microfoam-*.tar.gz)
          python -m pip install "${SDIST}[mfp1,mfp2]"

      # pip only warns when an extra does not exist: it still installs the
      # package and exits 0. So the install above cannot by itself prove the
      # extras resolved, and a gate that only checked pip's exit code would
      # pass with the dependencies absent. Assert they actually landed.
      - name: Assert both signing extras resolved
        run: |
          set -e
          . .venv/bin/activate
          python -c "import cryptography, nacl; print('cryptography and pynacl present')"

      - name: Round-trip through the installed entry point
        run: |
          set -e
          . .venv/bin/activate
          # Run from a scratch directory, so the `microfoam` command has to
          # resolve to the installed console script and the installed module,
          # not to the working tree.
          cd "$RUNNER_TEMP"
          microfoam --version

          # MFP2 (exercises the pynacl extra): sign, encrypt, verify, apply.
          python -c "from nacl.signing import SigningKey; s=bytes(range(32)); open('signing.key','wb').write(s); open('public.key','wb').write(bytes(SigningKey(s).verify_key)); open('symmetric.key','wb').write(bytes(range(32,64)))"
          FIX="$GITHUB_WORKSPACE/tests/fixtures"
          microfoam make --v2 \
            --old "$FIX/old.bin" --new "$FIX/new.bin" --out patch.mfp2 \
            --product 0x1234 --version 0x00020000 --old-version 0x00010000 \
            --signing-key signing.key --key symmetric.key \
            --key-id 00112233445566778899aabbccddeeff \
            --nonce-prefix 102132435465768798a9bacbdcedfe0f \
            --nonce-prefix-ack-reuse --record-log2 8
          microfoam inspect patch.mfp2
          microfoam verify patch.mfp2 --pub public.key
          microfoam apply --old "$FIX/old.bin" --patch patch.mfp2 \
            --out out-v2.bin --pub public.key --key symmetric.key
          cmp out-v2.bin "$FIX/new.bin"

          # MFP1 (exercises the cryptography extra): a different code path and a
          # different signing library, so one extra resolving does not imply the
          # other.
          microfoam keygen --private mfp1.key --public mfp1.pub
          microfoam make \
            --old "$FIX/old.bin" --new "$FIX/new.bin" --out patch.mfp \
            --product 0x1234 --version 0x00020000 --old-version 0x00010000 \
            --key mfp1.key --codec lz4
          microfoam verify patch.mfp --pub mfp1.pub
          microfoam apply --old "$FIX/old.bin" --patch patch.mfp \
            --out out-v1.bin --pub mfp1.pub
          cmp out-v1.bin "$FIX/new.bin"

  sodium:
    name: libsodium RFC, built-in Ed25519, and MFP2 parser-boundary tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install crypto dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev
          python -m pip install pynacl cryptography
      # Both providers on in one build, which is what makes the differential
      # section run: the built-in verifier and the libsodium adapter are
      # asserted to return the same verdict for every case, including
      # signatures libsodium generated over messages neither implementation
      # chose.
      - name: Configure with sodium and the built-in Ed25519 enabled
        run: cmake -B build-sodium -DCMAKE_BUILD_TYPE=Debug -DMCF_ENABLE_SODIUM=ON -DMCF_ENABLE_ED25519=ON
      - name: Build
        run: cmake --build build-sodium --config Debug
      - name: Test registered sodium targets
        run: ctest --test-dir build-sodium --output-on-failure -C Debug

  ed25519:
    name: built-in Ed25519 with no external crypto
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Configure with only the built-in verifier
        run: cmake -B build-ed25519 -DCMAKE_BUILD_TYPE=Debug -DMCF_ENABLE_ED25519=ON
      - name: Build
        run: cmake --build build-ed25519 --config Debug
      # Separate from the sodium job on purpose: that one links libsodium, so a
      # stray dependency on it inside mcf_ed25519.c would still resolve there.
      # This build has no external crypto at all, so it is the one that proves
      # the verifier is genuinely self-contained. The differential section
      # reports SKIP here and runs in the sodium job.
      - name: Test
        run: ctest --test-dir build-ed25519 --output-on-failure -C Debug

  lzma:
    name: LZMA codec (host tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the host signing module
        run: python -m pip install --quiet cryptography

      - name: Configure with LZMA enabled
        run: cmake -B build-lzma -DCMAKE_BUILD_TYPE=Debug -DMCF_ENABLE_LZMA=ON

      - name: Build
        run: cmake --build build-lzma --config Debug

      - name: Test
        # Includes lzma_conformance_test (67 liblzma vectors x 5 block sizes)
        # and cross_test_lzma (host-produced LZMA patch applied by the C
        # library). Both are the acceptance gates for calling LZMA supported.
        run: ctest --test-dir build-lzma --output-on-failure -C Debug

  fuzz:
    name: coverage-guided MFP2 parser fuzz
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Clang and PyNaCl
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          python -m pip install pynacl

      # MCF_BUILD_FUZZER builds the parser source into the fuzz target with
      # ASan/UBSan, so a fault inside mcf_v2_parse itself is caught, not merely
      # one in the harness. Clang supplies the coverage-guided libFuzzer runtime.
      - name: Configure with sanitizers and the fuzz target
        run: >
          cmake -B build-fuzz -DCMAKE_BUILD_TYPE=Debug
          -DMCF_BUILD_FUZZER=ON -DCMAKE_C_COMPILER=clang

      - name: Build
        run: cmake --build build-fuzz --config Debug

      # Real signed+encrypted patches seed the corpus, so the fuzzer starts from
      # a valid container instead of rediscovering the format from bytes.
      - name: Seed the corpus from host-produced MFP2 patches
        run: |
          set -e
          mkdir -p corpus
          python -c "from nacl.signing import SigningKey; s=bytes(range(32)); open('signing.key','wb').write(s); open('public.key','wb').write(bytes(SigningKey(s).verify_key)); open('symmetric.key','wb').write(bytes(range(32,64)))"
          for log2 in 8 10 13; do
            python host/microfoam.py make --v2 \
              --old tests/fixtures/old.bin --new tests/fixtures/new.bin \
              --out "corpus/valid-$log2.mfp2" --product 0x1234 \
              --version 0x00020000 --old-version 0x00010000 \
              --signing-key signing.key --key symmetric.key \
              --key-id 00112233445566778899aabbccddeeff \
              --nonce-prefix 102132435465768798a9bacbdcedfe0f \
              --nonce-prefix-ack-reuse \
              --record-log2 "$log2"
          done

      - name: Smoke-test the parser property oracle
        run: ./build-fuzz/v2_fuzz_smoke corpus/*.mfp2

      - name: Fuzz
        run: >
          ./build-fuzz/v2_parse_fuzzer corpus
          -max_total_time=90 -max_len=65536 -rss_limit_mb=2048
          -print_final_stats=1

  sanitizers:
    name: host suite under ASan and UBSan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The cross test signs a patch, so the host needs a signing module; the
      # seed comes from the build tree.
      - name: Install the host signing module
        run: python -m pip install --quiet cryptography

      # MCF_SANITIZE instruments every target, not just the parser: the engine,
      # the session state machine, the codec adapters and the container parser
      # all meet real inputs in the test suite, and none of them were covered by
      # a sanitizer before. -fno-sanitize-recover=all makes a finding abort
      # rather than print and continue, so a ctest pass means nothing fired.
      - name: Configure with sanitizers
        run: >
          cmake -B build-san -DCMAKE_BUILD_TYPE=Debug
          -DMCF_SANITIZE=ON -DCMAKE_C_COMPILER=clang

      - name: Build
        run: cmake --build build-san --config Debug

      - name: Test
        env:
          # Leak checking is meaningful here (the suite allocates workspace
          # through the HAL) but the host Python tool is not instrumented, so
          # only the C tests run under it.
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build-san --output-on-failure -C Debug

  headers:
    name: licence headers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Every source file carries an SPDX identifier
        run: |
          set -e
          missing=0
          # third_party/ is vendored unmodified; those files carry their own
          # upstream SPDX identifiers (LZMA-SDK-9.22), not ours.
          for f in $(git ls-files '*.c' '*.h' '*.py' | grep -v '^third_party/'); do
            if ! head -3 "$f" | grep -q 'SPDX-License-Identifier: MIT'; then
              echo "missing SPDX header: $f"
              missing=1
            fi
          done
          test $missing -eq 0

      - name: C and Python agree on the container layout
        run: python host/selftest.py --layout-only
