# SPDX-License-Identifier: MIT
#
# Microfoam CI.
#
# The gate that matters is the fault-injection suite: a library whose failure
# path has never been exercised is the failure mode this project exists to
# avoid. Everything else here exists to keep that suite buildable.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: host build and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --config Debug

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Debug

      - name: Report sizes
        if: always()
        shell: bash
        run: |
          echo "### Microfoam footprint" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f build/microfoam_tests ]; then
            ./build/microfoam_tests >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          elif [ -f build/Debug/microfoam_tests.exe ]; then
            ./build/Debug/microfoam_tests.exe >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          fi

  cross:
    name: cross-compile arm (${{ matrix.cortex }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cortex: [cortex-m0, cortex-m3, cortex-m4, cortex-m7]

    steps:
      - uses: actions/checkout@v4

      - name: Install the bare-metal arm toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Compile every source for ${{ matrix.cortex }}
        run: |
          set -e
          mkdir -p build-arm
          FLAGS="-mcpu=${{ matrix.cortex }} -mthumb -std=c99 -Os \
                 -ffunction-sections -fdata-sections -Wall -Wextra -Werror \
                 -Wconversion -Wsign-conversion -Wshadow -Wcast-qual \
                 -Iinclude -Isrc"
          # The libsodium adapter is opt-in and requires a host crypto library;
          # keep it out of the bare-metal core compile unless a provider-specific
          # embedded integration supplies its own implementation.
          for f in src/*.c; do
            case "$f" in
              src/mcf_sodium.c) continue ;;
            esac
            echo "  $f"
            arm-none-eabi-gcc $FLAGS -c "$f" -o "build-arm/$(basename "$f" .c).o"
          done

      - name: Compile the LZMA codec for ${{ matrix.cortex }}
        run: |
          set -e
          # The LZMA codec is opt-in but supported; compile it and the vendored
          # SDK for every core so enabling it can never break a target.
          FLAGS="-mcpu=${{ matrix.cortex }} -mthumb -std=c99 -Os \
                 -ffunction-sections -fdata-sections -Wall -Wextra \
                 -Wconversion -Wsign-conversion -Wshadow -Wcast-qual \
                 -Iinclude -Isrc -Ithird_party/lzma-sdk -DMCF_ENABLE_LZMA=1"
          arm-none-eabi-gcc $FLAGS -c src/mcf_lzma.c -o build-arm/mcf_lzma.o
          arm-none-eabi-gcc $FLAGS -c third_party/lzma-sdk/LzmaDec.c \
            -o build-arm/lzma_sdk_LzmaDec.o
          arm-none-eabi-size build-arm/mcf_lzma.o build-arm/lzma_sdk_LzmaDec.o \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Link and report size
        run: |
          set -e
          arm-none-eabi-size -t build-arm/*.o || true
          arm-none-eabi-gcc -mcpu=${{ matrix.cortex }} -mthumb -nostdlib \
            -Wl,--gc-sections -Wl,-Map=build-arm/microfoam.map \
            build-arm/*.o -o build-arm/libmicrofoam.a 2>/dev/null || true
          echo "### ${{ matrix.cortex }} object sizes" >> "$GITHUB_STEP_SUMMARY"
          arm-none-eabi-size build-arm/*.o >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

  python:
    name: host tool self-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Round-trip the host tool end to end
        run: |
          set -e
          mkdir -p build-py
          python host/selftest.py

  lzma:
    name: LZMA codec (host tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure with LZMA enabled
        run: cmake -B build-lzma -DCMAKE_BUILD_TYPE=Debug -DMCF_ENABLE_LZMA=ON

      - name: Build
        run: cmake --build build-lzma --config Debug

      - name: Test
        # Includes lzma_conformance_test (67 liblzma vectors x 5 block sizes)
        # and cross_test_lzma (host-produced LZMA patch applied by the C
        # library). Both are the acceptance gates for calling LZMA supported.
        run: ctest --test-dir build-lzma --output-on-failure -C Debug

  headers:
    name: licence headers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Every source file carries an SPDX identifier
        run: |
          set -e
          missing=0
          # third_party/ is vendored unmodified; those files carry their own
          # upstream SPDX identifiers (LZMA-SDK-9.22), not ours.
          for f in $(git ls-files '*.c' '*.h' '*.py' | grep -v '^third_party/'); do
            if ! head -3 "$f" | grep -q 'SPDX-License-Identifier: MIT'; then
              echo "missing SPDX header: $f"
              missing=1
            fi
          done
          test $missing -eq 0

      - name: C and Python agree on the container layout
        run: python host/selftest.py --layout-only
