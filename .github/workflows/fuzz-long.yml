# SPDX-License-Identifier: MIT
#
# Weekly long fuzz run with an accumulated corpus.
#
# The `fuzz` job in ci.yml is a bounded smoke test: 90 seconds, from three
# freshly generated seeds, on every push. Its corpus is discarded each run, so
# every push re-discovers the same ground. This workflow is the sustained
# counterpart - it restores the corpus from the cache, adds the same three
# seeds so a wiped cache still starts from a valid container, fuzzes for ten
# minutes, and saves the grown corpus back under a fresh key. Coverage
# therefore compounds week over week.
#
# Kept in its own file rather than as a second job in ci.yml so that a
# scheduled run does not re-execute the whole nineteen-job matrix.
#
# A finding here is a real one: the target is built with ASan/UBSan and the
# property oracle asserts that mcf_v2_parse returns a defined status, leaves
# its input byte-identical, and - on success - yields a view an independent
# re-derivation reproduces.

name: Long fuzz

on:
  schedule:
    # Sunday 03:00 UTC.
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-long:
    name: long fuzz run (accumulated corpus)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Clang and PyNaCl
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          python -m pip install pynacl

      - name: Configure with sanitizers and the fuzz target
        run: >
          cmake -B build-fuzz -DCMAKE_BUILD_TYPE=Debug
          -DMCF_BUILD_FUZZER=ON -DCMAKE_C_COMPILER=clang

      - name: Build
        run: cmake --build build-fuzz --config Debug

      # Accumulate: restore the newest saved corpus, then save a new entry under
      # this run's unique key. A miss is fine - the seeds below stand in.
      - name: Restore the accumulated corpus
        uses: actions/cache@v4
        with:
          path: corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Seed the corpus from host-produced MFP2 patches
        run: |
          set -e
          mkdir -p corpus
          python -c "from nacl.signing import SigningKey; s=bytes(range(32)); open('signing.key','wb').write(s); open('public.key','wb').write(bytes(SigningKey(s).verify_key)); open('symmetric.key','wb').write(bytes(range(32,64)))"
          for log2 in 8 10 13; do
            python host/microfoam.py make --v2 \
              --old tests/fixtures/old.bin --new tests/fixtures/new.bin \
              --out "corpus/valid-$log2.mfp2" --product 0x1234 \
              --version 0x00020000 --old-version 0x00010000 \
              --signing-key signing.key --key symmetric.key \
              --key-id 00112233445566778899aabbccddeeff \
              --nonce-prefix 102132435465768798a9bacbdcedfe0f \
              --nonce-prefix-ack-reuse \
              --record-log2 "$log2"
          done

      - name: Smoke-test the parser property oracle
        run: ./build-fuzz/v2_fuzz_smoke corpus/*.mfp2

      - name: Fuzz (ten minutes)
        run: >
          ./build-fuzz/v2_parse_fuzzer corpus
          -max_total_time=600 -max_len=65536 -rss_limit_mb=2048
          -print_final_stats=1
